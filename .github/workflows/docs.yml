name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'xtask/**'
      - 'tvision-rs-macros/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
      - '.github/scripts/manage-doc-versions.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys; never cancel a half-finished deploy (would corrupt
# the mirrored multi-version site).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: "https://oetiker.github.io/tvision-rs"

jobs:
  build:
    name: Build dev docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux (for screenshots)
        run: sudo apt-get update && sudo apt-get install -y tmux

      # Host this build under /tvision-rs/dev/ instead of /tvision-rs/.
      - name: Rebase doc URLs to /tvision-rs/dev/
        run: |
          sed -i 's|^site-url = "/tvision-rs/"|site-url = "/tvision-rs/dev/"|' docs/book/book.toml
          sed -i 's|href="/tvision-rs/|href="/tvision-rs/dev/|g' docs/book/theme/rustdoc-header.html
          grep -n 'site-url' docs/book/book.toml
          grep -n 'href=' docs/book/theme/rustdoc-header.html

      - name: Build integrated site (guide + api)
        run: cargo xtask docs

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dev
          path: docs/book/book
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Download dev docs
        uses: actions/download-artifact@v4
        with:
          name: docs-dev
          path: new-docs

      # The root index.html is a JS/meta-refresh redirect with no crawlable
      # links to the other version trees, so a single recursive wget from the
      # root only discovers the tree the redirect points at and silently drops
      # every other version. Crawl each tree listed in versions.json (plus
      # dev/) explicitly instead. index.html and versions.json are regenerated
      # below, so only the trees need mirroring.
      - name: Mirror existing GitHub Pages
        run: |
          mkdir -p site
          ORIGIN="${PAGES_URL%/tvision-rs}"
          trees=$(curl -sf "$PAGES_URL/versions.json" \
                  | grep -o '"path": *"[^"]*"' | cut -d'"' -f4 || true)
          { echo "/tvision-rs/dev/"; echo "$trees"; } | sort -u | while read -r p; do
            [ -n "$p" ] || continue
            wget --mirror --no-parent --no-host-directories \
                 --directory-prefix=site \
                 --reject="index.html?*" \
                 --execute robots=off \
                 --quiet \
                 "$ORIGIN$p" 2>/dev/null || echo "No existing tree at $p (skipping)"
          done
          find site -name "*.tmp" -delete 2>/dev/null || true
          find site -name 'index.html?*' -delete 2>/dev/null || true

      # wget saves query-string URLs (e.g. FontAwesome's "font.woff2?v=4.7.0"
      # refs in mdBook CSS) as literal "name?query" files. GitHub Pages rejects
      # artifacts containing such names ("Deployment failed, try again later");
      # before it rejected them it silently dropped them, losing the fonts of
      # every mirrored version. Strip the query suffix so the mirrored tree
      # matches what the CSS actually references.
      - name: Normalize wget query-string filenames
        run: |
          find site -depth -name '*\?*' -print0 | while IFS= read -r -d '' f; do
            clean="${f%%\?*}"
            if [ -e "$clean" ]; then rm "$f"; else mv "$f" "$clean"; fi
          done
          leftover=$(find site -name '*\?*' | head -5)
          [ -z "$leftover" ] || { echo "::error::query-string filenames remain: $leftover"; exit 1; }

      - name: Replace dev docs
        run: |
          rm -rf site/tvision-rs/dev
          mkdir -p site/tvision-rs/dev
          cp -r new-docs/* site/tvision-rs/dev/

      - name: Update versions and redirect
        run: |
          chmod +x .github/scripts/manage-doc-versions.sh
          .github/scripts/manage-doc-versions.sh site/tvision-rs cull
          .github/scripts/manage-doc-versions.sh site/tvision-rs update-json
          .github/scripts/manage-doc-versions.sh site/tvision-rs generate-redirect

      - name: Show final site structure
        run: |
          ls -la site/tvision-rs/
          echo "versions.json:"; cat site/tvision-rs/versions.json

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/tvision-rs
      - id: deployment
        uses: actions/deploy-pages@v4
